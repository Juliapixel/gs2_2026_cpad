name: cpad
description: "FluxoMed: painel de inteligência territorial da rede de saúde."
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  riverpod: ^3.5.0
  hooks_riverpod: ^3.5.0
  fl_chart: ^1.3.1
  shared_preferences: ^2.5.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/Inter-Italic-VariableFont_opsz,wght.ttf
        - asset: assets/Inter-VariableFont_opsz,wght.ttf
          style: italic
